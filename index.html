<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HomeRun CS ticket tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://accounts.google.com/gsi/client" async></script>
<script src="config.js"></script>
<style>
:root{
  --bg:#F4F5F7; --surface:#FFFFFF; --surface-2:#F9FAFB; --ink:#17202A; --muted:#5C6875; --faint:#8A95A1;
  --line:#DDE1E6; --line-strong:#C6CCD3; --accent:#2346A0; --accent-soft:#E7ECF8; --accent-ink:#FFFFFF;
  --ok:#1C7C4A; --ok-soft:#E3F3EA; --warn:#9A5B00; --warn-soft:#FBF0DC; --bad:#B3261E; --bad-soft:#FBE7E5;
  --shadow:0 8px 28px rgba(23,32,42,.14);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#12161B; --surface:#1A2027; --surface-2:#161B21; --ink:#E6EAEE; --muted:#A2ACB7; --faint:#77828E;
    --line:#2C343D; --line-strong:#3A444F; --accent:#8FA8EE; --accent-soft:#232E4A; --accent-ink:#0E1420;
    --ok:#6CCB97; --ok-soft:#173226; --warn:#E6B15C; --warn-soft:#3A2D16; --bad:#F08A80; --bad-soft:#3D1D1A;
    --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#12161B; --surface:#1A2027; --surface-2:#161B21; --ink:#E6EAEE; --muted:#A2ACB7; --faint:#77828E;
  --line:#2C343D; --line-strong:#3A444F; --accent:#8FA8EE; --accent-soft:#232E4A; --accent-ink:#0E1420;
  --ok:#6CCB97; --ok-soft:#173226; --warn:#E6B15C; --warn-soft:#3A2D16; --bad:#F08A80; --bad-soft:#3D1D1A;
  --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
a{color:var(--accent)}
.wrap{max-width:1600px;margin:0 auto;padding:20px clamp(12px,3vw,28px) 40px}
header.top{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end;justify-content:space-between;margin-bottom:18px}
h1{font-size:22px;font-weight:600;letter-spacing:-.01em;margin:0}
.sub{color:var(--muted);margin:2px 0 0;font-size:13px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line-strong);background:var(--surface);border-radius:7px;padding:7px 12px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.small{padding:4px 9px;font-size:12.5px;border-radius:6px}
.btn.link{border:none;background:none;padding:2px 0;color:var(--accent);font-size:12.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.toolbar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin-bottom:14px}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:none;background:none;padding:6px 12px;cursor:pointer;color:var(--muted);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.search{flex:1 1 220px;max-width:340px;border:1px solid var(--line-strong);border-radius:8px;padding:7px 11px;background:var(--surface)}
.active-filters{display:flex;gap:6px;flex-wrap:wrap}
.fchip{display:inline-flex;align-items:center;gap:6px;background:var(--accent-soft);color:var(--ink);border-radius:999px;padding:3px 6px 3px 11px;font-size:12.5px}
.fchip button{border:none;background:none;cursor:pointer;color:var(--muted);font-size:14px;line-height:1;padding:0 4px}

.tally{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:16px}
.tally button{background:var(--surface);border:none;text-align:left;padding:12px 14px;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.tally button:hover{background:var(--surface-2)}
.tally button[aria-pressed="true"]{background:var(--accent-soft);box-shadow:inset 0 -3px 0 var(--accent)}
.tally .n{font-size:24px;font-weight:600;letter-spacing:-.02em}
.tally .l{font-size:12.5px;color:var(--muted)}
.tally .bad .n{color:var(--bad)} .tally .warn .n{color:var(--warn)} .tally .ok .n{color:var(--ok)}

.banner{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:12px 14px;margin-bottom:14px;color:var(--muted)}
.banner.warn{border-color:var(--warn);background:var(--warn-soft);color:var(--ink)}

.tablebox{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:auto;max-height:max(420px,calc(100dvh - 260px))}
table{border-collapse:separate;border-spacing:0;width:100%;min-width:1480px}
thead th{position:sticky;top:0;z-index:2;background:var(--surface-2);border-bottom:1px solid var(--line-strong);text-align:left;font-weight:600;font-size:12.5px;color:var(--muted);padding:0;white-space:nowrap}
th .hd{display:flex;align-items:center;gap:4px;padding:9px 10px}
th .fbtn{border:1px solid transparent;background:none;border-radius:5px;padding:1px 4px;cursor:pointer;color:var(--faint);display:inline-flex;align-items:center}
th .fbtn:hover{border-color:var(--line-strong);color:var(--ink)}
th .fbtn.on{background:var(--accent);color:var(--accent-ink)}
td{border-bottom:1px solid var(--line);padding:9px 10px;vertical-align:top}
tbody tr:hover td{background:var(--surface-2)}
td.when{white-space:nowrap} td.when .d{font-weight:500} td.when .t{color:var(--muted);font-size:12.5px}
.pill{display:inline-block;border-radius:5px;padding:1px 7px;font-size:12.5px;font-weight:500;white-space:nowrap}
.pill.none{border:1px dashed var(--line-strong);color:var(--faint);font-weight:400}
.pill.cat{background:var(--accent-soft)}
.pill.yes{background:var(--ok-soft);color:var(--ok)}
.pill.no{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.msg{max-width:300px;cursor:pointer;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.msg.open{-webkit-line-clamp:unset;display:block}
.muted{color:var(--muted)} .faint{color:var(--faint);font-size:12.5px}
.owner{display:flex;flex-direction:column;gap:5px;min-width:190px}
.owner .row{display:flex;gap:6px}
.owner select{flex:1;min-width:0;border:1px solid var(--line-strong);border-radius:6px;padding:4px 6px;background:var(--surface)}
.owner .nm{font-weight:500}
.owner .meta{display:flex;gap:10px;flex-wrap:wrap}
.rca{display:flex;flex-direction:column;gap:4px;min-width:170px}
.rca a.file{display:inline-flex;align-items:center;gap:6px;font-weight:500;text-decoration:none;max-width:200px}
.rca a.file span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.att{display:flex;align-items:center;gap:6px}
.att a,.att button.dl{font-weight:500;text-decoration:none;max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border:none;background:none;padding:0;color:var(--accent);cursor:pointer;font-size:13.5px}
.linkform{display:flex;flex-direction:column;gap:5px}
.linkform input{border:1px solid var(--line-strong);border-radius:6px;padding:5px 7px;background:var(--surface);min-width:0;font-size:13px}
.linkform .row{display:flex;gap:6px}
.att .x{border:none;background:none;color:var(--faint);cursor:pointer;padding:0 2px;font-size:14px;line-height:1}
.ext{font-size:10.5px;font-weight:600;border-radius:4px;padding:0 4px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted)}
.mail{font-size:12.5px} .mail.ok{color:var(--ok)} .mail.bad{color:var(--bad)} .mail.warn{color:var(--warn)}
button.tagbtn{border:none;background:none;padding:0;cursor:pointer;text-align:left}
button.tagbtn:hover .pill{outline:1px solid var(--accent)}
.tat{white-space:nowrap;font-weight:500}
.tat.ok{color:var(--ok)} .tat.warn{color:var(--warn)} .tat.bad{color:var(--bad)}
.tat small{display:block;font-weight:400;color:var(--faint);font-size:12px}
.empty{padding:48px 20px;text-align:center;color:var(--muted)}
.empty h2{font-size:17px;color:var(--ink);margin:0 0 6px;font-weight:600}

.pop{position:fixed;z-index:50;background:var(--surface);border:1px solid var(--line-strong);border-radius:9px;box-shadow:var(--shadow);width:260px;max-width:calc(100vw - 24px);display:flex;flex-direction:column;max-height:min(380px,70vh)}
.pop input{margin:8px;border:1px solid var(--line-strong);border-radius:6px;padding:6px 8px;background:var(--surface)}
.pop ul{list-style:none;margin:0;padding:0 4px 6px;overflow:auto}
.pop li button{width:100%;text-align:left;border:none;background:none;padding:6px 8px;border-radius:5px;cursor:pointer;display:flex;justify-content:space-between;gap:10px}
.pop li button:hover{background:var(--surface-2)}
.pop li button[aria-checked="true"]{background:var(--accent-soft);font-weight:600}
.pop li .c{color:var(--faint);font-size:12px}
.pop .hint{padding:0 12px 8px;font-size:12px;color:var(--faint)}

dialog{border:none;border-radius:12px;padding:0;box-shadow:var(--shadow);background:var(--surface);color:var(--ink);width:min(640px,calc(100vw - 24px));max-height:calc(100dvh - 40px)}
dialog::backdrop{background:rgba(10,14,20,.45)}
.dlg{padding:20px 22px;display:flex;flex-direction:column;gap:14px;overflow:auto;max-height:calc(100dvh - 40px)}
.dlg h2{margin:0;font-size:18px;font-weight:600}
.dlg h3{margin:6px 0 0;font-size:14px;font-weight:600}
.dlg p{margin:0;color:var(--muted)}
.dlg .foot{display:flex;justify-content:flex-end;gap:8px;padding-top:4px}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:12.5px;font-weight:500;color:var(--muted)}
.field input,.field select{border:1px solid var(--line-strong);border-radius:7px;padding:7px 9px;background:var(--surface)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px 14px}
.olist{border:1px solid var(--line);border-radius:8px;overflow:hidden}
.olist .o{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line)}
.olist .o:last-child{border-bottom:none}
.olist .o .e{color:var(--muted);font-size:12.5px;overflow-wrap:anywhere}
.addrow{display:grid;grid-template-columns:1fr 1.3fr auto;gap:8px}
@media (max-width:560px){.addrow{grid-template-columns:1fr}}
.addrow input{border:1px solid var(--line-strong);border-radius:7px;padding:7px 9px;background:var(--surface);min-width:0}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);border-radius:10px;padding:12px 14px;box-shadow:var(--shadow);display:flex;gap:12px;align-items:center;flex-wrap:wrap;max-width:calc(100vw - 24px)}
.toast a,.toast button{color:var(--bg);font-weight:600}
.toast button{background:none;border:1px solid rgba(255,255,255,.35);border-radius:6px;padding:4px 9px;cursor:pointer}
.toast a{border:1px solid rgba(255,255,255,.35);border-radius:6px;padding:4px 9px;text-decoration:none}
:root[data-theme="dark"] .toast a,:root[data-theme="dark"] .toast button{border-color:rgba(0,0,0,.3)}
.gate{min-height:70vh;display:flex;align-items:center;justify-content:center}
.gate .card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:28px;max-width:420px;display:flex;flex-direction:column;gap:12px}
.gate h2{margin:0;font-size:19px} .gate p{margin:0;color:var(--muted)}
.who{color:var(--muted);font-size:12.5px;align-self:center}
.badge{display:inline-block;font-size:10.5px;font-weight:600;border-radius:4px;padding:0 5px;background:var(--accent-soft);color:var(--accent);margin-left:6px;vertical-align:1px}
.tatsel{border:1px solid var(--line-strong);border-radius:6px;padding:4px 6px;background:var(--surface);font-size:13px}
.drawer{position:fixed;top:0;right:0;bottom:0;z-index:40;width:min(560px,100vw);background:var(--surface);border-left:1px solid var(--line-strong);box-shadow:var(--shadow);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);animation:slidein .18s ease-out}
@keyframes slidein{from{transform:translateX(24px);opacity:.4}to{transform:none;opacity:1}}
.drawer .dh{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:18px 20px 12px;border-bottom:1px solid var(--line)}
.drawer .dh h2{margin:0;font-size:17px;font-weight:600}
.drawer .dh p{margin:3px 0 0;color:var(--muted);font-size:12.5px}
.drawer .x{border:1px solid var(--line-strong);background:var(--surface);border-radius:7px;width:32px;height:32px;cursor:pointer;font-size:18px;line-height:1;color:var(--muted);flex:none}
.drawer .tools{display:flex;gap:8px;align-items:center;padding:10px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.drawer .tools input{flex:1 1 180px;border:1px solid var(--line-strong);border-radius:7px;padding:6px 9px;background:var(--surface);font-size:13px;min-width:0}
.drawer .legend{display:flex;gap:12px;font-size:11.5px;color:var(--muted);padding:8px 20px 0}
.drawer .legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.drawer .list{overflow:auto;flex:1;padding:6px 12px 20px}
.cs-row{display:grid;grid-template-columns:18px 1fr auto;gap:6px 8px;align-items:center;padding:9px 8px;border-radius:8px}
.cs-row:hover{background:var(--surface-2)}
.cs-row.on{background:var(--accent-soft)}
.cs-row .tog{border:none;background:none;cursor:pointer;color:var(--muted);padding:0;width:18px;font-size:12px}
.cs-row .nm{border:none;background:none;padding:0;text-align:left;cursor:pointer;font:inherit;color:var(--ink);font-weight:600;overflow-wrap:anywhere}
.cs-row.sub .nm{font-weight:400}
.cs-row .nm:hover{color:var(--accent)}
.cs-row .cnt{font-weight:600;font-size:15px;text-align:right;min-width:36px}
.cs-row .meta{grid-column:2 / 4;display:flex;flex-direction:column;gap:4px}
.cs-row .stack{display:flex;height:7px;border-radius:4px;overflow:hidden;background:var(--line)}
.cs-row .stack span{display:block;height:100%}
.cs-row .nums{display:flex;gap:12px;font-size:11.5px;color:var(--muted)}
.cs-row .nums b{font-weight:600;color:var(--ink)}
.cs-sub{margin:0 0 4px 22px;border-left:2px solid var(--line);padding-left:6px}
.c-un{background:var(--faint)} .c-pend{background:var(--warn)} .c-done{background:var(--ok)}
.seg2{display:inline-flex;border:1px solid var(--line-strong);border-radius:7px;overflow:hidden}
.seg2 button{border:none;background:var(--surface);padding:5px 9px;font-size:12.5px;cursor:pointer;color:var(--muted)}
.seg2 button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
dialog.wide{width:min(1040px,calc(100vw - 24px))}
.rules{border:1px solid var(--line);border-radius:8px;overflow:auto;max-height:52vh}
.rules table{min-width:760px}
.rules th,.rules td{padding:6px 8px;border-bottom:1px solid var(--line);font-size:13px;text-align:left;vertical-align:middle}
.rules th{position:sticky;top:0;background:var(--surface-2);color:var(--muted);z-index:1}
.rules input{width:100%;border:1px solid var(--line-strong);border-radius:6px;padding:5px 7px;background:var(--surface);font-size:13px;min-width:0}
.rules .warnname{color:var(--warn);font-size:12px}
.olist .o input{border:1px solid var(--line-strong);border-radius:6px;padding:4px 7px;background:var(--surface);font-size:13px;min-width:0;width:100%}
.olist .o .oname{flex:0 0 32%} .olist .o .oemail{flex:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="gate" id="gate" hidden><div class="card"><h2>HomeRun CS ticket tracker</h2><p id="gateMsg">Enter the tracker’s access key. You only need to do this once on this browser.</p><input id="keyInput" type="password" autocomplete="off" placeholder="Access key" style="border:1px solid var(--line-strong);border-radius:7px;padding:8px 10px;background:var(--surface)"><button class="btn primary" id="btnKey" type="button">Open tracker</button></div></div>
<div class="wrap" id="app" hidden>
  <header class="top">
    <div>
      <h1>CS ticket tracker</h1>
      <p class="sub" id="subline">Freshchat conversations, product owner assignment and RCA</p>
    </div>
    <div class="actions">
      <button class="btn" id="btnCats" type="button" aria-controls="catDrawer" aria-expanded="false">Category summary</button>
      <button class="btn" id="btnRules" type="button">Assignment rules</button>
      <button class="btn" id="btnSettings" type="button">Product owners &amp; settings</button>
      <button class="btn primary" id="btnImport" type="button">Import Freshchat export</button>
    </div>
  </header>

  <div id="banner"></div>

  <div class="toolbar">
    <div class="seg" role="group" aria-label="Date range" id="rangeSeg">
      <button type="button" data-r="today" aria-pressed="true">Today</button>
      <button type="button" data-r="week">This week</button>
      <button type="button" data-r="30">Last 30 days</button>
      <button type="button" data-r="all">All</button>
    </div>
    <input class="search" id="search" type="search" placeholder="Search order ID or what the customer said">
    <div class="active-filters" id="activeFilters"></div>
  </div>

  <div class="tally" id="tally"></div>

  <div class="tablebox">
    <table>
      <thead><tr id="headRow"></tr></thead>
      <tbody id="body"></tbody>
    </table>
    <div id="emptyBox"></div>
  </div>
</div>


<dialog id="dlgImport"><div class="dlg" id="importBody"></div></dialog>
<dialog id="dlgSettings"><div class="dlg" id="settingsBody"></div></dialog>
<aside class="drawer" id="catDrawer" aria-label="Tickets by category" hidden></aside>
<dialog id="dlgRules" class="wide"><div class="dlg" id="rulesBody"></div></dialog>

<script>
(function(){
"use strict";
/* ---------- helpers ---------- */
function el(tag, attrs, kids){
  var n=document.createElement(tag);
  if(attrs) for(var k in attrs){var v=attrs[k]; if(v==null||v===false) continue;
    if(k==="class") n.className=v; else if(k==="text") n.textContent=v;
    else if(k.slice(0,2)==="on") n.addEventListener(k.slice(2),v); else n.setAttribute(k,v===true?"":v);}
  (kids||[]).forEach(function(c){ if(c==null) return; n.appendChild(typeof c==="string"?document.createTextNode(c):c); });
  return n;
}
function $(id){return document.getElementById(id)}
var NONE="__none", UNASSIGNED="__unassigned";
var CFG=window.TRACKER_CONFIG||{};
var BASE_URL=CFG.appUrl||location.href.split("#")[0], TRACKER_URL=BASE_URL;
var L1_LIST=["After Sales Query","App & Tech Issues","Delivered Product Issue","Delivery","HomeRun Related Queries","No Action Needed","Order Mgmt","Payments & Invoicing","Pre Order Queries","Return or Refund"];

}
function toTicket(r,m){
  function g(k){ return m[k]?r[m[k]]:""; }
  var t={}, d=m.createdAt?parseDate(g("createdAt")):null, conv=clean(g("convId"));
  if(!d && !conv) return null;
  if(d) t.createdAt=d.toISOString(); else t._updateOnly=true;
  if(m.convId) t.convId=conv;
  if(m.chatUrl){ var url=clean(g("chatUrl")); t.chatUrl=/^https?:\/\//i.test(url)?url:""; }
  if(m.l1) t.l1=canon(g("l1"));
  if(m.l2) t.l2=canon(g("l2"));
  if(m.orderId) t.orderId=clean(g("orderId"));
  if(m.channel) t.channel=clean(g("channel"));
  if(m.message) t.message=String(clean(g("message"))).slice(0,4000);
  if(m.activeOrder) t.activeOrder=parseActive(g("activeOrder"));
  t._id=conv?("c_"+safeId(conv)):("h_"+hash((t.createdAt||"")+"|"+(t.orderId||"")+"|"+(t.message||"")));
  return t;
}
/* ---- Freshchat chat-transcript export: one row per message → one ticket per conversation ---- */
function isTranscript(fields){ var f={}; fields.forEach(function(h){ f[String(h).trim()]=1; }); return f.conversation_id && f.message_parts && f.created_time && f.actor_type; }
function partsText(s){
  var p; try{ p=JSON.parse(s); }catch(_){ return String(s||""); }
  if(!Array.isArray(p)) return "";
  return p.map(function(x){ if(x.text) return String(x.text.content||""); if(x.image) return "[image]"; if(x.file) return "[file]"; return ""; }).filter(Boolean).join(" ");
}
var ORDER_RE=/HR\/\d{2}\/\d{4,7}/g;
function aggregateTranscript(rows){
  rows=rows.slice().sort(function(a,b){ return String(a.created_time).localeCompare(String(b.created_time)); });
  var map={}, order=[];
  rows.forEach(function(r){
    var id=clean(r.conversation_id); if(!id) return;
    var c=map[id]; if(!c){ c=map[id]={id:id,url:"",first:null,chan:"",src:"",user:[],uo:[],ao:[]}; order.push(id); }
    var d=parseDate(r.created_time); if(d && (!c.first||d<c.first)) c.first=d;
    if(!c.url && /^https?:\/\//.test(r.conversation_url||"")) c.url=r.conversation_url;
    if(!c.chan && r.channel_name) c.chan=r.channel_name;
    var text=partsText(r.message_parts), found=text.match(ORDER_RE)||[];
    var isUser=r.actor_type==="user" && r.message_type==="normal";
    if(isUser){ if(text.trim()) c.user.push(text.trim()); if(!c.src) c.src=r.message_source||""; }
    found.forEach(function(o){ var list=isUser?c.uo:c.ao; if(list.indexOf(o)<0) list.push(o); });
  });
  return order.map(function(id){
    var c=map[id]; if(!c.first) return null;
    var orders=c.uo.length?c.uo:c.ao;
    var ch=/^whatsapp/i.test(c.chan)?"WhatsApp":c.src==="mobile"?"App chat":c.src==="web"?"Web chat":(c.chan||c.src||"");
    return {_id:"c_"+safeId(id),_noCustomer:!c.user.length,createdAt:c.first.toISOString(),convId:id,chatUrl:c.url,channel:ch,
      orderId:orders.slice(0,3).join(", "),message:c.user.slice(0,3).join(" / ").slice(0,1500),source:"freshchat-transcript"};
  }).filter(Boolean);
}
function showTranscript(stage,rows){
  stage.textContent="";
  var items=aggregateTranscript(rows), withMsg=items.filter(function(t){return !t._noCustomer;}).length;
  var withOrder=items.filter(function(t){return t.orderId;}).length;
  stage.appendChild(el("h3",{text:"Freshchat chat transcript detected"}));
  stage.appendChild(el("p",{text:rows.length+" messages grouped into "+items.length+" conversations. "+withMsg+" have a customer message and "+withOrder+" mention an order ID (HR/…). The first customer messages become “Customer said”, and the conversation link becomes “Open chat”."}));
  stage.appendChild(el("p",{text:"This export has no L1/L2 columns, so new chats arrive as Not tagged and existing tags are kept. Import Freshchat’s category report afterwards, or tag chats by clicking the L1/L2 pill on a row."}));
  var bar=el("div",{class:"bar",hidden:true},[el("i")]), status=el("p",{class:"muted"});
  var go=el("button",{class:"btn primary",type:"button",text:"Import "+items.length+" conversations",onclick:function(){ go.disabled=true; bar.hidden=false; runItems(items,0,bar.firstChild,status,function(){ go.textContent="Done"; }); }});
  stage.appendChild(el("div",{style:"display:flex;flex-direction:column;gap:8px;margin-top:6px"},[go,bar,status]));
}
function runImport(rows,m,barFill,status,done){
  var seen={}, bad=0;
  rows.forEach(function(r){ var t=toTicket(r,m); if(!t){bad++; return;} var p=seen[t._id]; if(p && p.createdAt && t.createdAt && p.createdAt<t.createdAt) t.createdAt=p.createdAt; seen[t._id]=t; });
  runItems(Object.keys(seen).map(function(k){return seen[k];}),bad,barFill,status,done);
}
function runItems(items,bad,barFill,status,done){
  var i=0, added=0, updated=0, skipped=0, failed=0, total=items.length, active=0, LIMIT=6;
  function next(){
    while(active<LIMIT && i<total){ (function(t){ active++; write(t,0).then(function(r){ if(r==="added") added++; else if(r==="skipped") skipped++; else updated++; },function(){ failed++; }).then(function(){ active--; tick(); next(); }); })(items[i++]); }
    if(active===0 && i>=total){ status.textContent="Imported "+added+" new chats, updated "+updated+"."+(skipped?" Skipped "+skipped+" that aren’t in the tracker yet or have no customer message.":"")+(bad?" Skipped "+bad+" rows with no date or conversation ID.":"")+(failed?" "+failed+" couldn’t be saved; import the file again to retry them.":""); done(); }
  }
  function tick(){ var n=added+updated+skipped+failed; barFill.style.width=(total?Math.round(n/total*100):100)+"%"; status.textContent="Saving "+n+" of "+total+"…"; }
  function write(t,attempt){
    var body=Object.assign({},t); delete body._id; delete body._updateOnly; delete body._noCustomer;
    var ref=S.db.collection("tickets").doc(t._id);
    return ref.get().then(function(snap){
      if(snap.exists){ var cur=snap.data()||{}; if(cur.tagManual){ delete body.l1; delete body.l2; } return ref.update(body).then(function(){return "updated";}); }
      if(t._updateOnly||t._noCustomer) return "skipped";
      body=Object.assign({l1:"",l2:"",orderId:"",channel:"",message:"",activeOrder:"",convId:"",chatUrl:""},body);
      body.importedAt=new Date().toISOString(); return ref.set(body).then(function(){return "added";});
    }).catch(function(e){
      var c=e&&e.code; if((c==="resource-exhausted"||c==="unavailable") && attempt<4){ return new Promise(function(res){setTimeout(res,800*(attempt+1)+Math.random()*400);}).then(function(){return write(t,attempt+1);}); }
      throw e;
    });
  }
  if(!total){ status.textContent="Nothing to import. Check the column matching."; done(); return; }
  next();
}
$("btnImport").addEventListener("click",openImport);

/* ---------- toolbar ---------- */
Array.prototype.forEach.call($("rangeSeg").querySelectorAll("button"),function(x){ x.setAttribute("aria-pressed",x.getAttribute("data-r")===S.range?"true":"false"); });
$("rangeSeg").addEventListener("click",function(e){ var b=e.target.closest("button"); if(!b) return; S.range=b.getAttribute("data-r"); try{ localStorage.setItem("hr_range",S.range); }catch(_){}
  Array.prototype.forEach.call(this.querySelectorAll("button"),function(x){x.setAttribute("aria-pressed",x===b?"true":"false");}); subscribeTickets(); render(); });
var st=null; $("search").addEventListener("input",function(e){ clearTimeout(st); var v=e.target.value; st=setTimeout(function(){S.search=v; render();},150); });

/* running TAT clock (display only, no writes) */
setInterval(function(){ if(!pop && !document.querySelector("dialog[open]") && !(document.activeElement&&/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)) && S.tickets.some(function(t){return t.assignedAt&&!t.rcaAt;})) render(); },60000);

/* ---------- data ---------- */
function subscribeTickets(){
  if(!S.db) return; if(S.unsub) S.unsub(); S.loaded=false;
  var q=S.db.collection("tickets"), from=rangeStart();
  if(from) q=q.where("createdAt",">=",from.toISOString());
  q=q.orderBy("createdAt","desc").limit(3000);
  S.unsub=q.onSnapshot(function(snap){
    S.tickets=snap.docs.map(function(d){ var o=Object.assign({},d.data()); o.id=d.id; return o; });
    S.hitLimit=snap.size>=3000; S.loaded=true; render(); scheduleAuto();
  },function(e){ S.loaded=true; toast(e&&e.code==="permission-denied"?"Your account doesn’t have access to the tickets.":"Tickets stopped updating. Reload the page."); render(); });
}
function showGate(msg){ $("app").hidden=true; $("gate").hidden=false; if(msg) $("gateMsg").textContent=msg; }
var KEY_STORE="hr_cs_tracker_key";
function readKey(){
  var m=location.hash.match(/key=([A-Za-z0-9_-]{16,128})/);
  if(m){ try{ localStorage.setItem(KEY_STORE,m[1]); }catch(_){} history.replaceState(null,"",location.pathname+location.search); return m[1]; }
  try{ return localStorage.getItem(KEY_STORE)||""; }catch(_){ return ""; }
}
function start(){
  if(typeof firebase==="undefined"||!CFG.firebase||!CFG.firebase.apiKey||/YOUR_/.test(CFG.firebase.apiKey)){ showGate("This tracker isn’t set up yet. Add your Firebase project details to config.js (see README)."); $("keyInput").hidden=true; $("btnKey").hidden=true; return; }
  firebase.initializeApp(CFG.firebase);
  var fs=firebase.firestore();
  function open(key){
    var root=fs.collection("workspaces").doc(key);
    S.key=key; TRACKER_URL=BASE_URL+"#key="+key;
    S.fs=fs;
    S.db={collection:function(n){ return root.collection(n); },doc:function(p){ var a=p.split("/"); return root.collection(a[0]).doc(a[1]); }};
    root.collection("config").doc("settings").get().then(function(){
      $("gate").hidden=true; $("app").hidden=false; S.ready=true;
      S.db.collection("owners").orderBy("name").onSnapshot(function(snap){ S.owners=snap.docs.map(function(d){var o=Object.assign({},d.data()); o.id=d.id; return o;}); S.ownersLoaded=true; if(S._fillOwners && $("dlgSettings").open) S._fillOwners(); if(S._fillRules && $("dlgRules").open) S._fillRules(); render(); seedDefaults(); ensureOwners(); scheduleAuto(); },function(){});
      S.db.collection("routing").onSnapshot(function(snap){ S.routes=snap.docs.map(function(d){var o=Object.assign({},d.data()); o.id=d.id; return o;}); S.routesLoaded=true; if(S._fillRules && $("dlgRules").open) S._fillRules(); render(); seedDefaults(); scheduleAuto(); },function(){});
      S.db.doc("config/settings").onSnapshot(function(snap){ var v=snap.exists?snap.data():{}; S.settings={linkTemplate:v.linkTemplate||"",slaHours:Number(v.slaHours)||48,routingSeeded:!!v.routingSeeded}; S.settingsLoaded=true; render(); seedDefaults(); },function(){});
      subscribeTickets(); render();
    },function(e){
      try{ localStorage.removeItem(KEY_STORE); }catch(_){}
      showGate(e&&e.code==="permission-denied"?"That access key didn’t work. Check it and try again.":"Couldn’t reach the database. Check your connection and reload.");
    });
  }
  $("btnKey").addEventListener("click",function(){ var k=$("keyInput").value.trim(); if(!/^[A-Za-z0-9_-]{16,128}$/.test(k)){ $("gateMsg").textContent="The access key is 16 or more letters and numbers."; return; } try{ localStorage.setItem(KEY_STORE,k); }catch(_){} open(k); });
  $("keyInput").addEventListener("keydown",function(e){ if(e.key==="Enter") $("btnKey").click(); });
  var k=readKey(); if(k) open(k); else showGate();
}
start();
})();
</script>
